<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle - Zelda</title>
<style>
  :root{--bg:#0b0b0d;--panel:#15151a;--edge:#2a2a32;--accent:#3a6cf6;--text:#e8e8ec;--muted:#8a8a96;--gold:#ffd84a;
  --cross:#4a8cff;--circle:#ff5b6e;--square:#e58cff;--triangle:#5cdb7a;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;width:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none;}
  #app{height:100dvh;width:100vw;display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:8px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:2px 4px;}
  .topbar b{color:var(--gold);letter-spacing:.5px;}
  #status{color:#5cdb7a;font-size:11px;}
  .body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:0;}
  /* LEFT: analog */
  .left{flex:1;display:flex;justify-content:center;align-items:center;}
  /* CENTER: start */
  .center{display:flex;justify-content:center;align-items:center;flex-shrink:0;}
  /* RIGHT: buttons */
  .right{flex:1;display:flex;justify-content:center;align-items:center;}
  .stick{width:42vmin;max-width:170px;height:42vmin;max-height:170px;border-radius:50%;border:3px solid var(--edge);background:radial-gradient(circle at 50% 50%,#20202a,#0d0d11);position:relative;touch-action:none;}
  .knob{width:44%;height:44%;border-radius:50%;border:2px solid #3a3a46;background:radial-gradient(circle at 45% 40%,#3a3a46,#1c1c24);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;transition:transform .03s;}
  .faces{width:42vmin;max-width:170px;height:42vmin;max-height:170px;position:relative;}
  .fb{position:absolute;width:38%;height:38%;border-radius:50%;border:2px solid;background:var(--panel);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;cursor:pointer;touch-action:none;}
  .fb.active{filter:brightness(1.4);}
  .fb-cross{left:31%;bottom:0;border-color:var(--cross);color:var(--cross);}
  .fb-circle{right:0;top:31%;border-color:var(--circle);color:var(--circle);}
  .fb-square{left:0;top:31%;border-color:var(--square);color:var(--square);}
  .fb-triangle{left:31%;top:0;border-color:var(--triangle);color:var(--triangle);}
  .start{padding:10px 18px;border-radius:14px;border:1px solid var(--edge);background:var(--panel);color:var(--muted);font-size:11px;font-weight:800;cursor:pointer;touch-action:none;}
  .start.active{border-color:var(--accent);color:var(--text);}
  .legend{text-align:center;font-size:9px;color:var(--muted);padding-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><b>CONTROLE • ZELDA</b><span id="status">Conectando…</span></div>
  <div class="body">
    <!-- LEFT: ANALOG -->
    <div class="left">
      <div class="stick" id="stickL"><div class="knob" id="knobL"></div></div>
    </div>
    <!-- CENTER: START -->
    <div class="center"><div class="start" data-key="s" id="startBtn">START</div></div>
    <!-- RIGHT: BUTTONS -->
    <div class="right">
      <div class="faces">
        <div class="fb fb-triangle" data-key="i" title="TRIANGLE / INVENTÁRIO">△</div>
        <div class="fb fb-circle" data-key="b" title="CIRCLE / B">○</div>
        <div class="fb fb-square" data-key="x" title="SQUARE / X">□</div>
        <div class="fb fb-cross" data-key="a" title="CROSS / A">✕</div>
      </div>
    </div>
  </div>
  <div class="legend">analógico esq • START centro • ✕A ○B □X △INV dir</div>
</div>
<script>
const SOCKET_URL=window.location.protocol+'//'+window.location.hostname+':3001';
let socket=null,connected=false;
function setStatus(t,c){const s=document.getElementById('status');if(s){s.textContent=t;s.style.color=c;}}
function connect(){if(typeof io!=='undefined'){socket=io(SOCKET_URL,{transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>{connected=true;setStatus('CONECTADO','#5cdb7a');vib(30);});socket.on('disconnect',()=>{connected=false;setStatus('DESCONECTADO','#ff5b6e');});socket.on('connect_error',()=>{connected=false;setStatus('SEM CONEXÃO WS','#ffd84a');});}else setStatus('PRONTO','#ffd84a');}
function send(k,d){if(socket&&connected)socket.emit('remote-input',{key:k,down:d});try{localStorage.setItem('lastInput',JSON.stringify({key:k,down:d,time:Date.now()}));}catch(e){}}
function sendAnalog(x,y){if(socket&&connected)socket.emit('remote-analog',{x,y});}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

// buttons (START center + right faces)
document.querySelectorAll('[data-key]').forEach(el=>{
  const key=el.dataset.key;
  const down=e=>{e.preventDefault();e.stopPropagation();el.classList.add('active');try{el.setPointerCapture(e.pointerId);}catch(err){}send(key,true);vib(8);};
  const up=e=>{e.preventDefault();e.stopPropagation();el.classList.remove('active');send(key,false);};
  el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('lostpointercapture',()=>{el.classList.remove('active');send(key,false);});
  el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);el.addEventListener('mouseleave',()=>{if(el.classList.contains('active')){el.classList.remove('active');send(key,false);}});
});

// analog LEFT
(function(){
  const stick=document.getElementById('stickL'),knob=document.getElementById('knobL');let id=null;
  const maxR=()=>{const r=stick.getBoundingClientRect();return Math.min(r.width,r.height)/2-knob.getBoundingClientRect().width/2;};
  const reset=()=>{knob.style.transform='translate(-50%,-50%)';if(id!==null){sendAnalog(0,0);id=null;}};
  const move=(x,y)=>{const r=stick.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const m=maxR(),len=Math.hypot(dx,dy)||1,cl=Math.min(len,m);const nx=dx/len*cl/m,ny=dy/len*cl/m;knob.style.transform=`translate(calc(-50% + ${dx/len*cl}px), calc(-50% + ${dy/len*cl}px))`;sendAnalog(nx,ny);};
  stick.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(err){}move(e.clientX,e.clientY);vib(8);});
  stick.addEventListener('pointermove',e=>{if(id!==e.pointerId)return;e.preventDefault();move(e.clientX,e.clientY);});
  stick.addEventListener('pointerup',e=>{if(id!==e.pointerId)return;e.preventDefault();reset();});
  stick.addEventListener('pointercancel',reset);stick.addEventListener('lostpointercapture',reset);
  stick.addEventListener('touchstart',e=>{e.preventDefault();id=e.touches[0].identifier;move(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  stick.addEventListener('touchmove',e=>{if(id===null)return;e.preventDefault();for(const t of e.touches){if(t.identifier===id){move(t.clientX,t.clientY);break;}}},{passive:false});
  stick.addEventListener('touchend',e=>{e.preventDefault();reset();},{passive:false});stick.addEventListener('touchcancel',reset,{passive:false});
})();
document.addEventListener('touchmove',e=>{if(e.target.closest('[data-key],.stick'))e.preventDefault();},{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());

const script=document.createElement('script');script.src=SOCKET_URL+'/socket.io/socket.io.js';script.onload=connect;script.onerror=connect;document.head.appendChild(script);
</script>
</body>
</html>
